name: CI

# Roda em todo push e em todo pull request para a branch main.
# O badge no README usa este arquivo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    name: lint + testes + cobertura
    runs-on: ubuntu-latest

    services:
      # Banco real e descartável, igual ao de produção.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: biblioteca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d biblioteca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      LOG_LEVEL: warning
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/biblioteca
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/biblioteca
      SECRET_KEY: chave-de-ci
      PRAZO_DIAS: 14
      LIMITE_EMPRESTIMOS: 3

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Aplicar migrations
        run: alembic upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes com cobertura
        run: pytest --cov --cov-report=term-missing

  contrato:
    name: contrato OpenAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar validador
        run: pip install openapi-spec-validator==0.7.2

      # Falha o pipeline se o openapi.yaml ficar inválido (rota sem resposta,
      # $ref quebrado, versão errada do contrato etc.).
      - name: Validar docs/openapi.yaml
        run: openapi-spec-validator docs/openapi.yaml

  imagem:
    name: build da imagem Docker
    runs-on: ubuntu-latest
    needs: qualidade

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Prova que o Dockerfile (o mesmo usado no Coolify) builda.
      - name: Build da imagem
        run: docker build -t biblioteca-api:ci .
